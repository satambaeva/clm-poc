---
credentials:

  - name: AAP API token (Template_Automation)
    owner: Platform Automation
    owner_email: platformautomation@company.com
    type: token
    location: conjur://ansible/aap/platform/users/Template_Automation
    last_rotated: "2026-05-01"
    rotation_days: 90

  - name: AAP dev certificate
    owner: Platform Automation
    owner_email: platformautomation@company.com
    type: certificate
    location: certstore://prod/aap/dev/certificate
    expiration_date: "2027-01-01"

  - name: AAP prod certificate
    owner: Platform Automation
    owner_email: platformautomation@company.com
    type: certificate
    location: certstore://prod/aap/prod/certificate
    expiration_date: "2027-01-01"

  - name: Test Expiring Certificate
    owner: Platform Automation
    owner_email: platformautomation@company.com
    type: certificate
    location: certstore://test/expiring/certificate
    expiration_date: "2026-12-01"

  - name: GitHub Actions Conjur API key
    owner: Automation Team
    owner_email: automationteam@company.com
    type: secret
    location: CONJUR_AUTHN_API_KEY

  - name: GitHub App private keys
    owner: Automation Team
    owner_email: automationteam@company.com
    type: secret
    location: RHIT_AUTOMATION_APP_PRIVATE_KEY
