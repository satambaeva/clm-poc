---
- name: Credential Expiration Check
  hosts: localhost
  gather_facts: true

  vars_files:
    - ../inventory/credentials.yml
    - ../vars/thresholds.yml

  tasks:

    - name: Display current date
      debug:
        msg: "Today is {{ ansible_date_time.date }}"

    - name: Generate HTML report
      template:
        src: ../templates/report.html.j2
        dest: /tmp/credential_lifecycle_report.html

    - name: Read generated report
      command: cat /tmp/credential_lifecycle_report.html
      register: report_output
      changed_when: false

    - name: Display report
      debug:
        var: report_output.stdout

    - name: Email notification placeholder
      debug:
        msg: "EMAIL DELIVERY WILL BE ADDED HERE"

    - name: Teams notification placeholder
      debug:
        msg: "TEAMS NOTIFICATION WILL BE ADDED HERE"
