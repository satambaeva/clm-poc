---
- name: Credential Expiration Check
  hosts: localhost
  gather_facts: true

  vars_files:
    - ../inventory/credentials.yml
    - ../vars/thresholds.yml

  tasks:

    - name: Display credential status
      debug:
        msg: |
          Name: {{ item.name }}
          Type: {{ item.type }}
          Owner: {{ item.owner }}
          Expiration: {{ item.expiration_date | default('N/A') }}
          Last Rotated: {{ item.last_rotated | default('N/A') }}
      loop: "{{ credentials }}"
