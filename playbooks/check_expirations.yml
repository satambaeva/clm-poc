---
- name: Credential Expiration Check
  hosts: localhost
  gather_facts: true

  vars_files:
    - ../inventory/credentials.yml
    - ../vars/thresholds.yml

  tasks:

    - name: Generate HTML report
      template:
        src: ../templates/report.html.j2
        dest: /tmp/credential_lifecycle_report.html

    - name: Read generated report
      command: cat /tmp/credential_lifecycle_report.html
      register: report_output
      changed_when: false

    - name: Display report
      debug:
        var: report_output.stdout
