---
- name: Credential Expiration Check
  hosts: localhost
  gather_facts: true

  vars_files:
    - ../inventory/credentials.yml

  tasks:

    - name: Display current date
      debug:
        msg: "Today is {{ ansible_date_time.date }}"

    - name: Show certificate status
      debug:
        msg: |
          ==================================
          {{ item.name }}
          Owner: {{ item.owner }}
          Expires: {{ item.expiration_date }}
      loop: "{{ credentials }}"
      when:
        - item.type == "certificate"
        - item.expiration_date is defined
        - item.expiration_date != none

- name: Show token status
  debug:
    msg: |
      ==================================
      {{ item.name }}
      Owner: {{ item.owner }}
      Last Rotated: {{ item.last_rotated }}
      Rotation Interval: {{ item.rotation_days }} days
  loop: "{{ credentials }}"
  when:
    - item.type == "token"


- name: Calculate token age
  debug:
    msg: |
      ==================================
      {{ item.name }}
      Owner: {{ item.owner }}

      Last Rotated: {{ item.last_rotated }}
      Rotation Interval: {{ item.rotation_days }} days

      Rotation Age:
      {{
        (
          (
            ansible_date_time.date | to_datetime('%Y-%m-%d')
          ) -
          (
            item.last_rotated | to_datetime('%Y-%m-%d')
          )
        ).days
      }} days
  loop: "{{ credentials }}"
  when:
    - item.type == "token"
